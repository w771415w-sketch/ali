name: Restore ALI Source Tree

on:
  push:
    paths:
      - "source-export/**"
      - "scripts/extract_project.py"
      - ".github/workflows/restore-source-tree.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore source tree from export
        run: python scripts/extract_project.py
      - name: Verify source record count
        run: |
          test "$(find restored-project -type f | wc -l)" -eq 588
      - name: Compile restored Python
        run: |
          python -m compileall -q restored-project/backend
      - name: Write deterministic manifest
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path("restored-project")
          files=[p for p in root.rglob("*") if p.is_file() and "__pycache__" not in p.parts]
          rows=[]
          for p in sorted(files):
              rows.append({"path":str(p.relative_to(root)).replace("\\","/"),"sha256":hashlib.sha256(p.read_bytes()).hexdigest(),"bytes":p.stat().st_size})
          if len(rows)!=588:
              raise SystemExit(f"expected 588 restored files, got {len(rows)}")
          (root/"MANIFEST.json").write_text(json.dumps({"files":len(rows),"entries":rows},ensure_ascii=False,indent=2),encoding="utf-8")
          PY
      - name: Commit canonical restored tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add restored-project
          git diff --cached --quiet || git commit -m "Sync canonical restored source tree [skip ci]"
          git push
